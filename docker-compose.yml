version: '3.8'

services:
  api:
    build: .
    container_name: dropout_fl_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - storage_data:/app/storage_data
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dropout_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - STORAGE_DIR=/app/storage_data
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: dropout_fl_worker
    restart: always
    command: celery -A app.celery_app.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - storage_data:/app/storage_data
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/dropout_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - STORAGE_DIR=/app/storage_data
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: dropout_fl_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dropout_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dropout_fl_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  storage_data:
